plugins {
    id 'com.android.application'
}

android {
    namespace = "org.VitaPlex.app"
    // Google Play takes new apps and updates targeting Android 16 (API 36)
    // only, from 31 August 2026.
    compileSdkVersion 36
    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 36
        versionCode 1
        versionName "0.8.3"
        ndkVersion "27.3.13750724"
        externalNativeBuild {
            cmake {
                // ANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES: the app's own .so files
                // aligned for 16 KB memory pages, which Google Play requires of
                // native code (the libraries scripts/android builds are linked
                // with -z max-page-size=16384 already).
                arguments "-DANDROID_PLATFORM=android-21", "-DANDROID_STL=c++_shared", "-DCMAKE_WARN_DEPRECATED=FALSE",
                          "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
                // Feed the CI-resolved version into the native build so the
                // in-app Settings version matches the APK versionName. Without
                // it the native build falls back to reading the VERSION file,
                // which lags the resolved version on override/tag builds — the
                // app then shows e.g. 1.2.6 while the APK is 1.2.9. Each is a
                // single list element, so the space in "Beta 1.2.9" is
                // preserved (passed to cmake as one argv, not re-split).
                if (project.hasProperty('appVersion'))
                    arguments "-DAPP_VERSION=${project.appVersion}"
                if (project.hasProperty('appDisplayVersion'))
                    arguments "-DAPP_DISPLAY_VERSION=${project.appDisplayVersion}"
                abiFilters 'armeabi-v7a', 'arm64-v8a'
                version = '3.16.0+'
            }
        }
    }
    // Two builds. "github": the APKs released on GitHub, which update
    // themselves from there. "play": the app bundle for Google Play, which
    // updates through Play and so has no updater of its own (Play does not
    // allow an app to install updates itself): VITAPLEX_STORE_BUILD leaves it
    // out of the native code, and src/play/AndroidManifest.xml its permission.
    flavorDimensions = ["store"]
    productFlavors {
        github {
            dimension "store"
        }
        play {
            dimension "store"
            // Its own app on the phone and in the store, named VitaStream:
            // a name without Plex's trademark in it, for a store listing. The
            // GitHub build stays org.VitaPlex.app. (The Java package, and so
            // the JNI names, are the namespace's, org.VitaPlex.app, either way.)
            applicationId "io.github.breezyslasher.vitastream"
            externalNativeBuild {
                cmake {
                    arguments "-DVITAPLEX_STORE_BUILD=ON"
                }
            }
        }
    }
    applicationVariants.all { variant ->
        variant.outputs.each { output ->
            output.outputFileName = "VitaPlex-${output.getFilter("ABI")}.apk"
        }
    }
    signingConfigs {
        release {
            // A key of your own when one is given (Google Play's upload key,
            // kept out of the repository): VITAPLEX_KEYSTORE is its file, the
            // others its passwords and alias, from the environment or as
            // -P properties. Else borealis's sample key, as before, which is
            // public and fit only for the GitHub APKs.
            def prop = { String name ->
                project.hasProperty(name) ? project.property(name) : System.getenv(name)
            }
            def ownKey = prop('VITAPLEX_KEYSTORE')
            if (ownKey) {
                storeFile file(ownKey)
                storePassword prop('VITAPLEX_KEYSTORE_PASSWORD')
                keyAlias prop('VITAPLEX_KEY_ALIAS')
                keyPassword prop('VITAPLEX_KEY_PASSWORD')
            } else {
                storeFile file("borealis.jks")
                storePassword 'qwe123'
                keyAlias 'borealis'
                keyPassword 'qwe123'
            }

            // Optional, specify signing versions used
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }
    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a'
            universalApk false
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    if (!project.hasProperty('EXCLUDE_NATIVE_LIBS')) {
        sourceSets.main {
            jniLibs.srcDir 'libs'

            // FIX: Package app resources as APK assets so SDL2's AAssetManager
            // bridge can read them via SDL_RWFromFile("resources/...").
            //
            // With USE_LIBROMFS=OFF (see jni/CMakeLists.txt), borealis uses
            // RESOURCE_PREFIX="resources/" and reads all assets through SDL.
            // SDL2 on Android intercepts fopen("resources/foo") and reads from
            // the APK assets folder: assets/resources/foo.
            //
            // The staging dir (src/main/assets) is populated by the
            // syncBorealisResources Gradle task below, which copies:
            //   - app resources/  ->  assets/resources/
            //   - borealis i18n and img/sys/ into assets/resources/ (merged)
            // This runs before the mergeAssets step so everything is packaged.
            assets.srcDirs = [file("src/main/assets")]
        }
        externalNativeBuild {
            cmake {
                path 'jni/CMakeLists.txt'
                version = '3.16.0+'
            }
        }
    }
    applicationVariants.all { variant ->
        // Make sure assets are synced before they get merged into the APK,
        // and after the native build so EXCLUDE_NATIVE_LIBS logic is settled.
        def syncTask = tasks.named("syncBorealisResources")
        def capName = variant.name.capitalize()
        tasks.named("merge${capName}Assets").configure { dependsOn(syncTask) }

    }
    lint {
        abortOnError = false
    }
}

// Gradle 8 task validation: the lint tasks read src/main/assets, which
// syncBorealisResources writes. Wire the dependency at task level. Every lint
// task, flavoured or not: from the Android Gradle plugin 8.11 on they include
// generate<Variant>LintVitalReportModel, and the flavours (github, play) put
// the flavour first in each name (lintVitalGithubRelease ...).
tasks.matching { t ->
    t.name.toLowerCase().contains("lint")
}.configureEach {
    dependsOn(tasks.named("syncBorealisResources"))
}

// ---------------------------------------------------------------------------
// syncBorealisResources
//
// Copies app resources + borealis system resources into the Android assets
// staging directory so they are packaged into the APK.
//
// Output layout inside assets/:
//   resources/xml/...          <- app XML layouts
//   resources/font/...         <- fonts
//   resources/icons/...        <- app icons
//   resources/images/...       <- app images
//   resources/i18n/en-US/main.json         <- app i18n
//   resources/i18n/en-US/hints.json        <- borealis i18n (merged)
//   resources/img/sys/*.png                <- borealis status-bar icons (merged)
//   resources/material/...     <- material icons
//
// Why borealis resources must be merged:
//   borealis needs i18n/en-US/hints.json (button hint labels) and img/sys/
//   (wifi/battery status icons) at runtime. These live in lib/borealis/resources/
//   but are not committed to the app's resources/ folder. Merging them here
//   is the same approach Switchfin uses (they pre-commit the files; we merge
//   at build time to keep the source tree clean).
// ---------------------------------------------------------------------------
task syncBorealisResources(type: Copy) {
    // app/platform/android/app -> repo root is 4 levels up
    def repoRoot    = file("../../../../")
    def appRes      = file("${repoRoot}/resources")
    def brls        = file("${repoRoot}/lib/borealis/resources")
    def assetsDir   = file("src/main/assets/resources")

    // Wipe staging dir for a clean copy every build
    doFirst {
        delete assetsDir
        assetsDir.mkdirs()
    }

    // 1. Copy all app resources
    from(appRes) {
        into ""
    }

    // 2. Merge borealis i18n (hints.json) — do NOT overwrite app's main.json
    from("${brls}/i18n") {
        into "i18n"
        include "en-US/hints.json"
    }

    // 3. Merge borealis status-bar icons (img/sys/)
    from("${brls}/img") {
        into "img"
        include "sys/**"
    }

    into assetsDir

    // Always re-run so resources stay in sync with source changes
    outputs.upToDateWhen { false }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')

    // MediaSessionCompat + MediaBrowserServiceCompat. The framework
    // MediaSession.Callback has no onSetShuffleMode/onSetRepeatMode, so with it
    // a remote controller (Android Auto head unit, Pebble/Wear media browser)
    // has no standard way to set those modes — only app-specific PlaybackState
    // custom actions, which most clients ignore. The compat session exposes them
    // properly and lets clients read the current state back.
    implementation 'androidx.media:media:1.7.0'

}
